name: Core & GUI CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'vault-core/**'
      - 'cmd/**'
      - 'pkg/**'
      - '.github/workflows/ci.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'vault-core/**'
      - 'cmd/**'
      - 'pkg/**'
      - '.github/workflows/ci.yml'
      - 'go.mod'
      - 'go.sum'

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

jobs:
  # Linux Build: Rust Core + Go CLI
  build-linux:
    name: Build Linux (Core & CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Test Rust Core
        run: |
          cd vault-core
          cargo test --verbose

      - name: Build Rust Core (Release)
        run: |
          cd vault-core
          cargo build --release

      - name: Test Go CLI
        env:
          CGO_ENABLED: 1
        run: |
          go test -v ./pkg/... ./internal/... ./tests/...

      - name: Build Go CLI
        env:
          CGO_ENABLED: 1
        run: |
          go build -v -o bin/dirlocker-cli ./cmd/cli

  # Windows Build: Wails GUI
  build-windows:
    name: Build Windows (Wails GUI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Rust Core (Windows DLL)
        run: |
          cd vault-core
          cargo build --release

      - name: Build Wails App
        shell: pwsh
        run: |
          $env:CGO_ENABLED = 1
          cd cmd/gui
          wails build -clean
