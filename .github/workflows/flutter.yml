name: Flutter CI

on:
  push:
    branches: [ main ]
    paths:
      - 'clients/mobile/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'clients/mobile/**'
      - '.github/workflows/flutter.yml'

jobs:
  build-mobile:
    name: Build & Test Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clients/mobile

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build APK (Debug)
        run: flutter build apk --debug --no-pub
