[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
authors = ["Vault Team"]
description = "Core cryptographic library for encrypted vault containers"
license = "MIT OR Apache-2.0"

[lib]
name = "vault_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
# Cryptographic dependencies (pure Rust implementations)
chacha20poly1305 = "0.10"  # Replaces libsodium XChaCha20-Poly1305
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
x25519-dalek = "2.0"
curve25519-dalek = "4.0"

# Serialization and utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling and logging
thiserror = "1.0"
log = "0.4"

# FFI and C compatibility
libc = "0.2"

# Random number generation
rand = "0.8"
getrandom = "0.2"

# Hash functions
sha2 = "0.10"

# Base64 encoding
base64 = "0.21"

# Hex encoding
hex = "0.4"
keyring = "2"

[dev-dependencies]
tempfile = "3.0"

[features]
default = ["std"]
std = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
